name: Deploy Client via SFTP

on:
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'client/**'     # Only trigger if client files change
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-client.yml'

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in `if:`; lift the one the upload needs so the step can be skipped when it is unset.
      SFTP_SERVER: ${{ secrets.SFTP_SERVER }}

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🛠️ Build Project
      # vite.config.ts sets output to ./dist/public
      # The production bundle calls same-origin /api. Do not bake VITE_API_URL:
      # an absolute API host makes the session cookie third-party.
      run: npm run build:client

    - name: ⏭️ SFTP upload skipped
      if: env.SFTP_SERVER == ''
      run: echo "::notice::SFTP_SERVER is not set, so the build was checked but not uploaded (production serves the client from Railway's charting-the-course service)."

    - name: 📂 Sync files via SFTP
      if: env.SFTP_SERVER != ''
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.SFTP_SERVER }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        protocol: ftps
        port: 21
        local-dir: ./dist/public/
        dangerous-clean-slate: true
