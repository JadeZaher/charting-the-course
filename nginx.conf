# Railway terminates TLS and may connect here over HTTP. Keep the visitor's scheme and host.
# When those headers are absent (a local container), fall back to this server's own.
map $http_x_forwarded_proto $neos_forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}
map $http_x_forwarded_host $neos_forwarded_host {
    ''      $host;
    default $http_x_forwarded_host;
}

server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API so the host-only session cookie is first-party on this site.
    # BACKEND_URL has no path: a trailing slash would make nginx drop the /api prefix.
    # Host is the upstream name (the public edge routes on it). The visitor's host goes in X-Forwarded-Host.
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $neos_forwarded_proto;
        proxy_set_header X-Forwarded-Host $neos_forwarded_host;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # ^~ so the signed-in /messaging route does not swallow the socket.
    location ^~ /messaging/ws {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $neos_forwarded_proto;
        proxy_set_header X-Forwarded-Host $neos_forwarded_host;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    error_page 404 /404.html;

    location = / { try_files /index.html =404; }

    # Prerendered public pages: the first response includes the page text.
    location = /about { try_files /about/index.html =404; }
    location = /communities { try_files /communities/index.html =404; }
    location = /governance-model { try_files /governance-model/index.html =404; }
    location = /terms { try_files /terms/index.html =404; }
    location = /privacy { try_files /privacy/index.html =404; }
    location = /blog { try_files /blog/index.html =404; }
    location = /news { try_files /news/index.html =404; }
    location = /practices { try_files /practices/index.html =404; }

    # Former practice slugs, before the reviewed titles.
    location = /practices/act { return 301 https://neos.primusneo.com/practices/act-is-not-a-vote; }
    location = /practices/agreements-and-decision-records { return 301 https://neos.primusneo.com/practices/agreements-decision-records; }

    # Former essay URLs.
    location = /writing { return 301 https://neos.primusneo.com/blog; }
    location = /writing/act-is-not-a-vote { return 301 https://neos.primusneo.com/blog/act-is-not-a-vote; }
    location = /writing/the-key-stays-in-the-browser { return 301 https://neos.primusneo.com/blog/the-key-stays-in-the-browser; }
    location ^~ /writing/ { return 404; }

    # Module children exist only when a prerendered file exists.
    location ^~ /blog/ { try_files $uri $uri/index.html =404; }
    location ^~ /practices/ { try_files $uri $uri/index.html =404; }
    location ^~ /news/ { try_files $uri $uri/index.html =404; }

    location = /feed.xml {
        types { }
        default_type application/rss+xml;
        try_files /feed.xml =404;
    }
    location = /rss.xml { return 301 https://neos.primusneo.com/feed.xml; }

    # Paths that used to return the homepage shell.
    location = /research { return 404; }
    location = /papers { return 404; }
    location = /learn { return 404; }
    location = /docs { return 404; }
    location = /guides { return 404; }
    location = /industries { return 404; }
    location = /sectors { return 404; }

    # Signed-in app routes still load the client. /governance-model is not one of these.
    location ~ ^/(dashboard|updates|agreements|proposals|explore|quizzes|quiz|welcome|profile|my-quiz-history|discover|solutions|ethos|orientation|map|admin|teams|members|domains|decisions|onboarding|conflicts|ecosystems|emergency|exit|safeguards|comms|messaging|chat|compliance|settings|login)(/|$) {
        try_files $uri /index.html;
    }
    location = /me { try_files /index.html =404; }
    location ^~ /me/ { try_files $uri /index.html; }
    location = /governance { try_files /index.html =404; }
    location ^~ /communities/ { try_files $uri /index.html; }
    location ^~ /users/ { try_files $uri /index.html; }
    location ^~ /node/ { try_files $uri /index.html; }

    # Files that exist, including the homepage. Anything else is a real 404.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        try_files /404.html =403;
    }
}
