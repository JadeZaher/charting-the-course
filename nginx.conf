server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered public pages: the first response includes the page text.
    location = /about { try_files /about/index.html =404; }
    location = /communities { try_files /communities/index.html =404; }
    location = /governance-model { try_files /governance-model/index.html =404; }
    location = /terms { try_files /terms/index.html =404; }
    location = /privacy { try_files /privacy/index.html =404; }

    # SPA fallback — other routes serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
